name: CI

# Validación en Pull Requests y en ramas que NO son main.
# No despliega ni toca la base de datos: comprueba tipos, corre la suite de
# vitest y que el código compila.

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  validate:
    name: Typecheck, tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Variables ficticias: ni los tests ni el build se conectan a la BD ni a Redis
    # (los tests simulan Prisma/ioredis/DNS y las páginas son `force-dynamic`),
    # pero satisfacen la validación de entorno si llegara a correr.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      AUTH_SECRET: ci_placeholder_secret_0123456789
      INGEST_API_TOKEN: ci_placeholder_token
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      # Suite de vitest: sin servicios externos (Postgres/Redis/red van simulados).
      - name: Tests (vitest)
        run: npm test

      - name: Build
        run: npm run build
